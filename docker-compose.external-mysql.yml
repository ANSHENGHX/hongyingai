x-app-environment: &app-environment
  APP_ENV: production
  MYSQL_HOST: host.docker.internal
  REDIS_HOST: redis
  RABBITMQ_HOST: rabbitmq
  MINIO_ENDPOINT: http://minio:9000
  MINIO_CONSOLE_ENDPOINT: http://minio:9001

x-app-service: &app-service
  build: .
  env_file:
    - ${ENV_FILE:-.env.server}
  environment:
    <<: *app-environment
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=256m
  volumes:
    - ai-work:/work
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    redis:
      condition: service_started
    rabbitmq:
      condition: service_started
    minio:
      condition: service_started

services:
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  rabbitmq:
    image: rabbitmq:4.1-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-change-me}
    ports:
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-change-me}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9003:9001"
    volumes:
      - minio-data:/data

  api:
    <<: *app-service
    command: ["uvicorn", "hongying_ai.api:app", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "127.0.0.1:8080:8080"

  parser-worker:
    <<: *app-service
    environment:
      <<: *app-environment
      WORKER_KIND: parser
      APP_SERVICE_NAME: ai-parser-worker
    command: ["hongying-worker"]

  planner-worker:
    <<: *app-service
    environment:
      <<: *app-environment
      WORKER_KIND: planner
      APP_SERVICE_NAME: ai-planner-worker
    command: ["hongying-worker"]

  composer-worker:
    <<: *app-service
    environment:
      <<: *app-environment
      WORKER_KIND: composer
      APP_SERVICE_NAME: ai-composer-worker
    command: ["hongying-worker"]
    tmpfs:
      - /tmp:size=512m

  quality-worker:
    <<: *app-service
    environment:
      <<: *app-environment
      WORKER_KIND: quality
      APP_SERVICE_NAME: ai-quality-worker
    command: ["hongying-worker"]

volumes:
  redis-data:
  rabbitmq-data:
  minio-data:
  ai-work:
