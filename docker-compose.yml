x-app-environment: &app-environment
  MYSQL_HOST: mysql
  REDIS_HOST: redis
  RABBITMQ_HOST: rabbitmq
  MINIO_ENDPOINT: http://minio:9000

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ai_platform
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-change-me}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_PASSWORD:-change-me}"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  rabbitmq:
    image: rabbitmq:4.1-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-change-me}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-change-me}
    ports:
      - "9000:9000"
      - "9003:9001"
    volumes:
      - minio-data:/data

  api:
    build: .
    env_file: ${ENV_FILE:-.env.example}
    environment:
      <<: *app-environment
    command: ["uvicorn", "hongying_ai.api:app", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "8080:8080"
    read_only: true
    tmpfs:
      - /tmp:size=256m
    volumes:
      - ai-work:/work
    depends_on:
      mysql:
        condition: service_healthy

  parser-worker:
    build: .
    env_file: ${ENV_FILE:-.env.example}
    environment:
      <<: *app-environment
      WORKER_KIND: parser
      APP_SERVICE_NAME: ai-parser-worker
    command: ["hongying-worker"]
    read_only: true
    tmpfs:
      - /tmp:size=256m
    volumes:
      - ai-work:/work

  planner-worker:
    build: .
    env_file: ${ENV_FILE:-.env.example}
    environment:
      <<: *app-environment
      WORKER_KIND: planner
      APP_SERVICE_NAME: ai-planner-worker
    command: ["hongying-worker"]
    read_only: true
    tmpfs:
      - /tmp:size=256m
    volumes:
      - ai-work:/work

  composer-worker:
    build: .
    env_file: ${ENV_FILE:-.env.example}
    environment:
      <<: *app-environment
      WORKER_KIND: composer
      APP_SERVICE_NAME: ai-composer-worker
    command: ["hongying-worker"]
    read_only: true
    tmpfs:
      - /tmp:size=512m
    volumes:
      - ai-work:/work

  quality-worker:
    build: .
    env_file: ${ENV_FILE:-.env.example}
    environment:
      <<: *app-environment
      WORKER_KIND: quality
      APP_SERVICE_NAME: ai-quality-worker
    command: ["hongying-worker"]
    read_only: true
    tmpfs:
      - /tmp:size=256m
    volumes:
      - ai-work:/work

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  minio-data:
  ai-work:
