[project]
name = "hongying-ai-platform"
version = "1.0.0"
description = "宏映AI Python智能视频平台 V1.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aio-pika>=9.5,<10",
  "asyncmy>=0.2.10,<1",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "minio>=7.2,<8",
  "prometheus-client>=0.22,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "redis>=6.2,<7",
  "sqlalchemy>=2.0.41,<3",
  "tenacity>=9.1,<10",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.0,<2",
  "ruff>=0.12,<1",
]

[project.scripts]
hongying-api = "hongying_ai.api:run"
hongying-worker = "hongying_ai.worker:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hongying_ai"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101"]
